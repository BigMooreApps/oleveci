# Nixpacks configuration for OleVeci on Easypanel / Railway / Hostinger
providers = ['node']

[phases.setup]
nixPkgs = ['nodejs_22', 'npm-10_x', 'ffmpeg', 'python3']

[phases.install]
cmds = ['npm install --include=optional']

[phases.build]
cmds = ['npm run build']

[start]
cmd = 'node dist/server.cjs'

[variables]
NODE_ENV = 'production'
PORT = '3000'
